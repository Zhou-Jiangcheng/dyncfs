[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dyncfs"
version = "2.0.9"
description = "A Python library for computing Coulomb Failure Stress Change."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Zhou Jiangcheng", email = "zhoujcpku@outlook.com" }]
dependencies = [
    "pygrnwang>=2.0.9",
    "matplotlib>=3.9.2",
]

[project.scripts]
dyncfs = "dyncfs.main:main"

[project.urls]
Homepage = "https://github.com/Zhou-Jiangcheng/dyncfs"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dyncfs*"]
exclude = ["test*"]

[tool.setuptools.package-data]
pygrnwang = ["exec/"]